name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 00:00 (台灣時間早上 8:00) 自動更新

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download latest data from Google Drive
        shell: bash
        run: |
          mkdir -p public
          curl -L "https://docs.google.com/spreadsheets/d/1C03_PNRWmS3vO-2nz2cFO9QW1k4EDD-W/export?format=xlsx" -o "public/LINE OA 加入資料_分析結果.xlsx"

      - name: Build project
        shell: bash
        run: |
          mkdir -p dist
          cp index.html main.js style.css dist/
          cp -r public/* dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
